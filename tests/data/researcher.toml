# i) Books, edited books, and book chapters.
#
# The bibliographic fields follow BibLaTeX where possible. The `kind` field
# selects the BibLaTeX entry type:
#   book         -> @book
#   edited-book  -> @book/@collection with editor
#   chapter      -> @inbook
#
# `publisher_category` is the SENSE category used by the CS standards and is
# not a BibLaTeX field.
[[candidate.books]]
kind = "book"                 # book | edited-book | chapter
publisher_category = "A"      # A | B | C | D | E | unlisted

author = ["Fikl, Alexandru"]
title = "Book title"
publisher = "UVT"
location = "Timișoara"
date = "2026"
isbn = "9-0000-0000-0000"
pagetotal = 120
url = "https://example.com"

